name: lint
on: [push, pull_request]

jobs:
  ruff:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Lint with ruff
      run: uv run --locked --only-group dev ruff check --output-format github
