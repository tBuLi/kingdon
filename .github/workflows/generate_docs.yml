name: docs
on: [push, pull_request]


jobs:
  build-docs:
    name: Build and generate docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up uv and Python 3.13
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Build docs
      run: |
        sudo apt-get install pandoc
        uv run --locked --group docs sphinx-build -nW -b html docs docs_build
