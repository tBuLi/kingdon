name: pytest_and_coveralls
on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up uv and Python 3.14
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        enable-cache: true
    - name: Test with coverage
      run: uv run --locked --group test --with pytest-cov pytest --cov=kingdon
    - name: Upload to Coveralls
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: uv run --no-sync --with coveralls coveralls --service=github
