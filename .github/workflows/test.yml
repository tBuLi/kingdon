name: pytest
on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: setup.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
    # The array tests are parametrized over the array libraries that einops and
    # array-api-compat both support, and skip those that are not installed. They are only
    # installed on the newest python, since their wheels are large. cupy is absent
    # altogether because it needs a GPU.
    - name: Install torch and jax
      if: matrix.python-version == '3.13'
      # The CPU-only index keeps torch to a ~200 MB wheel, instead of the several GB of CUDA
      # wheels that the default PyPI build pulls in and that the tests have no use for.
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install jax
    - name: Test with pytest
      run:
        pytest
