name: pytest
on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v5
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --group test
    # The array tests are parametrized over the array libraries that einops and
    # array-api-compat both support, and skip those that are not installed. They are only
    # installed on the newest python, since their wheels are large. cupy is absent
    # altogether because it needs a GPU.
    - name: Install torch, jax and numba
      if: matrix.python-version == '3.14'
      run: uv sync --locked --group test --group arrays
    - name: Test with pytest
      run: uv run --no-sync pytest
